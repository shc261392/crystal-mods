[project]
name = "skip-all-intro"
version = "0.1.0"
description = "Skips all intro movies for Dawn of War Definitive Edition (Vortex-installable)"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
