[project]
name = "steam-scan"
version = "0.1.0"
description = "Cross-platform Steam library + installed-game discovery."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
]

[project.scripts]
steam-scan = "steam_scan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_scan"]
