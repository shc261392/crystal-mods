[project]
name = "game-discover"
version = "0.1.0"
description = "Inspect an installed PC game directory and emit a moddability report."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
game-discover = "game_discover.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_discover"]
