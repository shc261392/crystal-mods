[project]
name = "translation-tool"
version = "0.1.0"
description = "Glossary-aware translation pipeline for Crystal Mods localisation work"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
tl = "translation_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/translation_tool"]
