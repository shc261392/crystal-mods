[project]
name = "pcgw-fetch"
version = "0.1.0"
description = "Fetch PCGamingWiki metadata into <game>/metadata.jsonc."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
]

[project.scripts]
pcgw-fetch = "pcgw_fetch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcgw_fetch"]
