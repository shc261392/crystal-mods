Name: Yanidor
Description: Willful people live in this village. Some of the peasants were compelled to work the Pohodyashin plants, but they revolted, as it was too far away and inconvenient to work there.
ShortQuestDescr: Find a cross that a demon wore
LongQuestDescr: Old Egor said that there's an ikotnitsa in Yanidor. You set forth to this village with Nikolay to get a cross from the ikonitsa for the bride of the banyas.

