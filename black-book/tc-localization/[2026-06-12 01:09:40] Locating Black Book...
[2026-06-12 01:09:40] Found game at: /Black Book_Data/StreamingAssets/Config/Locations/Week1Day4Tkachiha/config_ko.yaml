Name: 방적공의 오두막
Description: 피안테그 마을 바로 바깥에는 마녀의 오두막이 있다. 방적공은 강력하고 유명한 현자로, 그녀에 대한 이야기는 빌고르트까지 전해졌다. 몇몇 소녀가 사랑의 묘약을 구하러 방적공을 찾아갔다. 이고르 할아버지는 그런 부탁을 들어주시지 않기 때문이다.
ShortQuestDescr: 방적공에게서 끈 얻기
LongQuestDescr: 당신은 방적공이라는 마녀에게서 마법을 불어넣은 띠를 얻기로 했습니다. 이고르 할아버지도 같이 가야 합니다. 방적공은 강력한 마녀이기 때문에 그녀를 상대하려면 이고르 할아버지의 도움이 필요할지도 모릅니다.
