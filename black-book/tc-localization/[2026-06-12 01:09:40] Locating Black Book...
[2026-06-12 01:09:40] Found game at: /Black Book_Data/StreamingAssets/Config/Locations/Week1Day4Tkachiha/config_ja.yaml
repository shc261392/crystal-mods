Name: 糸繰りの小屋
Description: 魔女の小屋はピャンテク村のすぐ外にある。糸繰りは実力のある有名なズナートキだ。ヴィルゴルトの人々でさえ、この魔女のことは聞いたことがあるだろう。少女たちの中には魔女の元を訪れて惚れ薬を買う者までいる。エゴールおじいちゃんはそういう商売をしていないのだ。
ShortQuestDescr: 糸繰りから紐を手に入れる
LongQuestDescr: ヴァシリーサは、「糸繰り」と呼ばれる魔女から魔法の紐を手に入れることにした。エゴールじいさんも同行している。糸繰りは対処の難しい強力な魔女であるため、エゴールの助けが必要になるかもしれない。
