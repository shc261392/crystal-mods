Name: Изба Пряхи
Description: Изба колдуньи стоит поодаль от села Пянтег. Пряха шибко знаткая, про нее слава и до Вильгорта дошла. Несколько девок за приворотом к ней ходили. Дед Егор-то не делает такое.
