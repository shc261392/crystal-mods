Name: Paramedic Station
Description: This village built a large paramedic station where they supposedly can treat diseases. Or at least they try to, but they're no kolduns. All of this "treating" has led to the appearance of a fever.
ShortQuestDescr: Make candles using the fat from the bodies of those who died from the fever.
LongQuestDescr: They say fever has spread across Iskora. Wherever the fever spreads, death follows.

