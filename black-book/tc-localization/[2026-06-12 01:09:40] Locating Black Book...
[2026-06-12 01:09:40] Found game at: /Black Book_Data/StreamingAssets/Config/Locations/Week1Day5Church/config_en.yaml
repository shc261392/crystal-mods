Name: Trinity Church
Description: The church stands atop the northern slope, the most scenic spot in Vilgort. It was built with white stone and at night it looks like it glows. In the sun it shines even brighter!
ShortQuestDescr: Get a name from the Menologies
LongQuestDescr: Christians receive their names from the Menologies, so you set forth to Trinity Church in Vilgort to get a name for the bride of the banya.

