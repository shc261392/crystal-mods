Name: Old Banyas
Description: Banyas are prone to fires; people stoke the flames too hard at times. That's why they're often built on riverbanks. Nowadays, some of these banyas are abandoned.
ShortQuestDescr: Rescue the changeling
LongQuestDescr: You have collected all of the necessary items to free the changeling from the obderikha. All that's left is to go to the old banya and rescue her!

