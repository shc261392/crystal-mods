Name: Village Gathering
Description: This village was built around a barnyard to make managing grain easier. I'll gather everyone here as soon as I find the imposter.
ShortQuestDescr: Find the Leshiy.
LongQuestDescr: You should leave Nemzya! The raven said that the only way to do that is to overcome the leshiy who is pretending to be one of the peasants here in this village.

