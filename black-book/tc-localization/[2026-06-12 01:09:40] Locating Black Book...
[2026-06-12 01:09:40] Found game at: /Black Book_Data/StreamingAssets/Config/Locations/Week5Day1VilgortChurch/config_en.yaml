Name: Nikolay's Wedding
Description: The rumor is, this white church is getting an annex. It's not too surprising, this village is huge.
ShortQuestDescr: Guard the Wedding
LongQuestDescr: Nikolay and his bride are ready to get married, but Alexander has to continue to spoil their wedding. His chorts force him to. You intend to protect your friends and learn of the items for the Kupala rite in the process.

