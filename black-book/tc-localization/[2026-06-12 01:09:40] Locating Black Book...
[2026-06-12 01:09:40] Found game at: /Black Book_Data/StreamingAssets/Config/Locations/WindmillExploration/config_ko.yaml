Name: 오래된 풍차
Description: 이 풍차는 마을과 숲, 두 세계의 경계선에 서 있습니다. 소문에 따르면 이 방앗간의 주인도 콜둔이지만, 이고르 할아버지만큼 강력하지는 않다고 합니다.
ShortQuestDescr: 방아꾼의 초르트 처리하기
LongQuestDescr: 도움을 청하러 온 사람이 말하길 자신의 초르트가 맷돌 돌리는 걸 멈추고 풍차를 부수기 시작했다고 합니다. 당신은 그 초르트들을 찾아가 그 악마들을 정의로운 길로 이끌기로 했습니다.
LevelConfig:
  Battle:
    Name: 방아꾼의 초르트

