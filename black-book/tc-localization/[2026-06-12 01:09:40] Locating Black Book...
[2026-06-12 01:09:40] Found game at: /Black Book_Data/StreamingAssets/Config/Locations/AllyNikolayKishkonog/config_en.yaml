Name: Kishkonogov Sloboda
Description: Sloboda was the name for villages free of serfdom. However, there have never been noblemen here in Cherdyn. Go figure.
ShortQuestDescr: Find Nikolay's missing friend
LongQuestDescr: Nikolay is troubled over his friend's disappearance, a hunter from Kishkonogov sloboda. We've set out in search of him.

